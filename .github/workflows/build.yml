name: Build MultiPicture APK (2025 Modern)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17 (2025 Standard)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        packages: 'platforms;android-34 build-tools;34.0.0'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x gradlew
      
    - name: Build with latest Gradle (8.5)
      run: ./gradlew assembleFreeDebug assembleDntDebug --stacktrace
      
    - name: Upload APKs with Build Info
      uses: actions/upload-artifact@v4
      with:
        name: multipicture-apks-${{ github.run_number }}
        path: |
          app/build/outputs/apk/**/*.apk
        retention-days: 30